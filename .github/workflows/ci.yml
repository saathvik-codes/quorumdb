name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # -race: the Raft node, transport and store are all concurrent; a data race is a bug even when the test passes
      - run: go test -race -count=1 -timeout 300s ./...
